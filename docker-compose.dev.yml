# Local development overlay. Builds every service from source instead of
# pulling a pre-built image, and mounts the source tree into each container
# so edits show up without rebuilding. The opposite of
# docker-compose.selfhost.yml, which needs no source code at all.
#
# Usage (no docker-compose.selfhost.prod.yml — this never needs TLS):
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.dev.yml up --build
#
# Postgres/Redis are unchanged from the base file (same named Docker
# volumes), so dev data persists across restarts the same way. This is the
# only file in the set that bind-mounts local paths — the base file and its
# prod overlay never do.
#
# For pure frontend UI work, DEVELOPERS.md's "Frontend UI development loop"
# (plain `npm run dev` on the host against a remote dev server) hot-reloads
# faster than this container does and is usually the better choice. The
# frontend service below is for when you want the whole stack local.
services:
  api:
    depends_on:
      garage-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      ENVIRONMENT: development
    # The base file publishes no port at all, so this is a plain addition,
    # not an override. Every interface, so the API is reachable from
    # another device on the LAN (phone/tablet testing). The frontend
    # container's Vite dev server proxy doesn't depend on this at all — it
    # reaches the API over the docker network by service name (api:8000).
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - ./shared:/shared
      - ./scripts:/app/scripts
      - ./VERSION:/app/VERSION:ro
      - ./data/uploads:/uploads
      - ./data/project-images:/app/project-images
      - ./data/reference-images:/app/reference-images
    # --reload watches /app; edits under services/api take effect without a
    # container restart. Single worker: --reload and multiple uvicorn
    # workers don't mix.
    command:
      ["sh", "-c", "exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]

  bulk-upload:
    depends_on:
      garage-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/bulk-upload/Dockerfile
    environment:
      ENVIRONMENT: development
    volumes:
      - ./services/bulk-upload:/app
      - ./services/ingestion:/ingestion_lib
      - ./shared:/shared

  detection:
    depends_on:
      garage-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/detection/Dockerfile
    volumes:
      - ./services/detection:/app
      - ./shared:/shared
      - ./models:/models

  classification:
    depends_on:
      garage-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/classification/Dockerfile
    volumes:
      - ./services/classification:/app
      - ./shared:/shared
      - ./models:/models

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      ENVIRONMENT: development
    volumes:
      - ./services/notifications:/app
      - ./shared:/shared

  notifications-email:
    build:
      context: .
      dockerfile: services/notifications-email/Dockerfile
    environment:
      ENVIRONMENT: development
    volumes:
      - ./services/notifications-email:/app
      - ./shared:/app/shared

  # Local object storage. The base file has none (production points at an
  # external Garage, see garage/), so dev runs the same Garage locally. In
  # .env: MINIO_ENDPOINT=garage:3900, MINIO_SECURE=false, GARAGE_RPC_SECRET,
  # GARAGE_ADMIN_TOKEN, and MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in Garage's
  # key format (GK + 24 hex / 64 hex), which garage-init imports.
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: addaxai-garage
    restart: unless-stopped
    profiles: [full]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addaxai-network

  # garage/init.sh in a container. Shares garage's network namespace, so
  # the CLI (which also needs the node key from the meta volume) and the S3
  # API are on 127.0.0.1, as on the Garage server.
  garage-init:
    build:
      context: garage
      dockerfile: Dockerfile.init
    image: addaxai-connect-garage-init:dev
    container_name: addaxai-garage-init
    profiles: [full]
    network_mode: service:garage
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_INIT_IN_CONTAINER: "1"
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_CAPACITY: 10G
      GARAGE_KEY_ID: ${MINIO_ROOT_USER}
      GARAGE_KEY_SECRET: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./garage/init.sh:/init.sh:ro
      - garage_meta:/var/lib/garage/meta:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  # Runs the Vite dev server instead of the built nginx image, so edits
  # under services/frontend/src hot-reload. Use http://localhost:5173.
  frontend:
    image: node:22-alpine
    working_dir: /app
    command:
      ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    # Every interface, so it's reachable from another device on the LAN too.
    ports:
      - "5173:5173"
    volumes:
      - ./services/frontend:/app
      # Anonymous volume so the container's own (Linux) node_modules isn't
      # shadowed by whatever host OS installed under the bind mount above.
      - /app/node_modules
    environment:
      ENVIRONMENT: development

  postgres:
    ports:
      - 5433:5432

volumes:
  garage_meta:
  garage_data:
