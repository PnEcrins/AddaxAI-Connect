# Single-node Garage. Secrets (rpc_secret, admin_token) come from the
# GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN env vars set in docker-compose.yml.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

# Camera images are JPEGs, already compressed.
compression_level = "none"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must match the region the app signs with (shared/shared/storage.py).
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
